<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2 - Counter App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f1efe9;
      font-family: Arial, Helvetica, sans-serif;
      color: #292929;
    }

    .counter-card {
      width: 100%;
      max-width: 500px;
      padding: 34px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #d8d5cd;
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .counter-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 22px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    #count {
      margin: 0 0 28px;
      font-size: 96px;
      line-height: 1.1;
      font-weight: 700;
      color: #397a12;
      transition: color 0.2s ease;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 22px;
      border: 1.5px solid #99968f;
      border-radius: 13px;
      background: #fff;
      color: #292929;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease,
                  transform 0.2s ease, border-color 0.2s ease;
    }

    button:hover {
      background: #292929;
      border-color: #292929;
      color: #fff;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      margin: 0;
      color: #666;
      font-size: 18px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .counter-card {
        padding: 28px 18px;
      }

      #count {
        font-size: 80px;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="counter-card">
    <h1>Counter</h1>
    <p id="count">0</p>

    <div class="button-row">
      <button type="button" id="decrease">Decrease</button>
      <button type="button" id="reset">Reset</button>
      <button type="button" id="increase">Increase</button>
    </div>

    <p class="hint">Green above 0, red below 0, maximum 10</p>
  </main>

  <script>
    let count = 0;

    const countDisplay = document.getElementById("count");

    function updateCounter() {
      countDisplay.textContent = count;

      // Ternary operator: green above 0, red below 0, dark at 0.
      countDisplay.style.color =
        count > 0 ? "#397a12" : count < 0 ? "#d32f2f" : "#292929";
    }

    document.getElementById("decrease").addEventListener("click", function () {
      count--;
      updateCounter();
    });

    document.getElementById("reset").addEventListener("click", function () {
      count = 0;
      updateCounter();
    });

    document.getElementById("increase").addEventListener("click", function () {
      if (count < 10) {
        count++;
      }
      updateCounter();
    });

    updateCounter();
  </script>
</body>
</html>
