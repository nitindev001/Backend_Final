<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Dark and Light Theme Toggle</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1efe9;
      font-family: Arial, Helvetica, sans-serif;
      color: #292929;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .page-card {
      width: 100%;
      max-width: 620px;
      padding: 32px;
      border: 1px solid #c9c6be;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transition: background-color 0.3s ease, color 0.3s ease,
                  border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .theme-label {
      margin: 0 0 14px;
      color: #777;
      font-size: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .description {
      margin: 0 0 26px;
      color: #444;
      font-size: 20px;
      line-height: 1.5;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: #292929;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease,
                  transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #444;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Dark theme styles are applied when JavaScript adds .dark to body. */
    body.dark {
      background: #292929;
      color: #f5f3ed;
    }

    body.dark .page-card {
      background: #292929;
      border-color: #55534e;
      color: #f5f3ed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    body.dark .theme-label,
    body.dark .description {
      color: #d0cec8;
    }

    body.dark button {
      background: #f5f3ed;
      color: #292929;
    }

    body.dark button:hover {
      background: #dedbd2;
    }

    @media (max-width: 480px) {
      .page-card {
        padding: 26px 22px;
      }

      h1 {
        font-size: 27px;
      }

      .description {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page-card">
    <p class="theme-label" id="themeLabel">Light theme</p>
    <h1>Welcome to my page</h1>
    <p class="description">
      This paragraph changes colour when the theme changes.
    </p>
    <button type="button" id="themeButton">Switch to Dark</button>
  </main>

  <script>
    const themeButton = document.getElementById("themeButton");
    const themeLabel = document.getElementById("themeLabel");

    themeButton.addEventListener("click", function () {
      // Toggle the dark class on the body on every click.
      document.body.classList.toggle("dark");

      const isDark = document.body.classList.contains("dark");

      // Ternary operator changes the button text and theme label.
      themeButton.textContent = isDark ? "Switch to Light" : "Switch to Dark";
      themeLabel.textContent = isDark ? "Dark theme" : "Light theme";
    });
  </script>
</body>
</html>
